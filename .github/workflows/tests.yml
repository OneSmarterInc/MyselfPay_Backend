name: Backend tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: selfpay_test
          POSTGRES_USER: selfpay
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U selfpay" --health-interval 5s --health-retries 10
    env:
      DJANGO_DEBUG: 'true'
      DJANGO_SECRET_KEY: 8b4e24d661f77c36a50d7b1220c9d9c01c114dfe407e6fabd637ae32b77011ad
      DATABASE_URL: postgresql://selfpay:isolated-ci-password@127.0.0.1:5432/selfpay_test?sslmode=disable
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock
      - run: python manage.py check
      - run: python manage.py migrate --noinput
      - run: python manage.py seed_demo
      - name: Domain and Django regression tests (SQLite)
        run: python -m unittest discover -v
      - name: Django admin regression tests
        run: python manage.py test api.admin_regression --noinput -v 2
      - name: Real PostgreSQL HTTP, account and booking integration tests
        env:
          API_TEST_DATABASE_URL: postgresql://selfpay:isolated-ci-password@127.0.0.1:5432/selfpay_test?sslmode=disable
        run: python -m unittest tests.test_api tests.test_directory_performance -v
      - name: Real PostgreSQL spatial integration tests
        env:
          SPATIAL_TEST_DATABASE_URL: postgresql://selfpay:isolated-ci-password@127.0.0.1:5432/selfpay_test?sslmode=disable
        run: python -m unittest tests.test_spatial -v
      - name: Production deployment settings check
        env:
          DJANGO_DEBUG: 'false'
          DJANGO_ALLOWED_HOSTS: api.example.com
          FRONTEND_ORIGIN: https://app.example.com
        run: python manage.py check --deploy --fail-level WARNING
      - name: Container build
        run: docker build -t selfpay-backend:test .
